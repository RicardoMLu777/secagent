name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Major versions pinned on purpose. pytest 9 and pytest-asyncio 1.x
          # shipped days apart in Oct 2026 and break the asyncio_mode=auto
          # setup in pytest.ini. Keep these ranges until the suite is ported.
          pip install "pytest>=8.3,<9" "pytest-asyncio>=0.24,<1"

      - name: Run test suite
        run: pytest tests/ -v

      - name: Collect failure details
        if: failure()
        run: |
          echo "===== installed versions ====="
          pip list 2>/dev/null | grep -iE "^(openai|mcp|pydantic|httpx|rich|pytest)" || true
          echo "===== import agent ====="
          python -c "import agent" > /tmp/imp.log 2>&1 || true
          cat /tmp/imp.log
          tail -6 /tmp/imp.log | while IFS= read -r line; do echo "::error::IMP $line"; done
          echo "===== pytest head ====="
          pytest tests/ -q 2>&1 | head -25 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --select E,F,W --ignore E501

      - name: Byte-compile all sources
        run: python -m compileall -q agent mcp_servers secagent.py
